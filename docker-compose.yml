# Tutorial 03 — Airflow
#
#   docker compose up -d --build      # first time: builds the image, then starts it
#   docker compose ps                 # wait for STATUS = healthy (about a minute)
#   docker compose exec airflow cat /opt/airflow/standalone_admin_password.txt
#
# A fresh clone runs as-is, on Linux too: both containers default to root, so
# they can write the bind-mounted directories whatever your uid is. The files
# they create then belong to root. If that bothers you -- it should, on a machine
# you share -- copy .env.example to .env and put your own uid in it:
#
#     cp .env.example .env && sed -i "s/=1000$/=$(id -u)/" .env
#
# Then open http://127.0.0.1:18080 and log in as `admin`.
#
# Airflow UI   http://127.0.0.1:18080     (user `admin`)
# MLflow UI    http://127.0.0.1:15030     (no login)

name: ddm501-t03

services:
  airflow:
    build: .
    image: ddm501-t03-airflow:2.8.4
    container_name: ddm501-t03-airflow
    command: standalone
    ports:
      # 18080, not 8080: Lab 2's Airflow already owns 8080 and you will want
      # to run both at some point.
      - "18080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      # Read by the train task. Without it the DAG's own default applies, which
      # is 127.0.0.1:5000 -- correct for the local venv route, but inside this
      # container that address is the container itself, not the server below.
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # MLflow tags each run with the current git commit if it can find one.
      # There is no git in this image, and GitPython says so at length in the
      # middle of the train log. Nothing here needs the commit.
      GIT_PYTHON_REFRESH: quiet
      # Airflow and its dependencies are a `pip install --user` inside the image,
      # which Python only finds under the home directory of the uid running it.
      # The image's entrypoint arranges that for the container's own process, but
      # `docker compose exec` does not go through the entrypoint -- so without
      # this, every exercise below dies on `No module named 'airflow'` the moment
      # the container runs as anything other than uid 50000. Setting it here
      # covers every uid, including the root default.
      HOME: /home/airflow
    depends_on:
      mlflow:
        condition: service_healthy
    # Root by default, so a fresh `git clone && docker compose up -d` writes to
    # the bind mounts below on any machine, including a Linux VPS where your uid
    # is not the image's own 50000. The cost is that new files under data/ and
    # logs/ belong to root. Put your uid in .env (copy .env.example) to get them
    # back -- the directories themselves already belong to you, because their
    # .gitkeep is tracked and Docker never had to create them.
    user: "${AIRFLOW_UID:-0}:0"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs
      # Exercise 2 runs scripts/corrupt_extract.py against the mounted extract.
      - ./scripts:/opt/airflow/scripts
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    image: ddm501-t03-mlflow:2.19.0
    container_name: ddm501-t03-mlflow
    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////mlflow-data/mlflow.db
      # --serve-artifacts means the client uploads through this server, so
      # Airflow needs no access to the artifact folder itself. One less shared
      # mount to get the permissions wrong on.
      - --serve-artifacts
      - --artifacts-destination
      - file:///mlflow-data/mlartifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
    ports:
      # 15030 follows Lab 2's numbering (its MLflow is on 15020), and stays off
      # 5000, which macOS gives to the AirPlay receiver.
      - "15030:5000"
    # Same story as the Airflow container above: on Linux the container writes to
    # the bind mount as whatever uid it runs as, and root-owned files inside your
    # own project folder cannot be deleted without sudo. Put your uid in .env.
    # The default is right on macOS and Windows.
    user: "${MLFLOW_UID:-0}:0"
    volumes:
      # The database and the artifacts on your disk rather than inside the
      # container, so `docker compose down` does not throw away your runs and
      # you can look at them. The directory ships with a .gitkeep precisely so
      # it already exists and already belongs to you -- if Docker has to create
      # it, it creates it as root and the non-root case above breaks on the
      # first write.
      - ./mlflow-data:/mlflow-data
    healthcheck:
      # No curl in python:3.11-slim, so ask Python to make the request.
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped
